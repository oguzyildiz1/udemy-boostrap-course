<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Mini-Project Starter</title>
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <!-- card 1 -->
                <div class="card border-0 rounded-3 my-5 shadow-lg p-3">
                    <h2 class="card-title fw-bold fs-1">Free</h2>
                    <p class="text-muted">for freelancers</p>
                    <h2 class="fw-bold mb-4">$0</h2>
                    <ul class="list-group list-group-flush fs-5 mb-2 vstack gap-2">
                        <li class="list-group-item border-0"><i class="bi bi-check2"></i>Single User</li>
                        <li class="list-group-item border-0"><i class="bi bi-check2 "></i>10 Downloads per Month</li>
                        <li class="list-group-item border-0"><i class="bi bi-check2"></i>Faster Files</li>
                        <li class="list-group-item border-0"><i class="bi bi-check2"></i>25 Custom Packs</li>
                    </ul>
                    <button class="btn btn-dark mt-5 mb-4 rounded-4 fw-semibold">Subscribe</button>
                </div>
            </div><!-- card 1 ends-->

            <div class="col-md-6">
                <!-- card 2 -->
                <div class="card border-0 mt-5 my-5 shadow-lg p-3 bg-black text-light rounded-3">
                    <h2 class="card-title fs-1 fw-bold">Pro</h2>
                    <p class="">For Agencies</p>
                    <h2 class="mb-4 fw-bold">$100</h2>
                    <ul class="list-group list-group-flush v-stack gap-2 border-0 bg-black fs-5">
                        <li class="list-group-item bg-black text-white border-0"><i class="bi bi-check2"></i>Unlimited Users</li>
                        <li class="list-group-item bg-black text-white border-0"><i class="bi bi-check2 text-light"></i>Unlimited Downloads</li>
                        <li class="list-group-item bg-black text-white border-0"><i class="bi bi-check2 text-light"></i>Fully-Editable Files</li>
                        <li class="list-group-item bg-black text-white border-0"><i class="bi bi-check2 text-light"></i>200+ Custom Packs</li>
                    </ul>
                    <button class="btn btn-light rounded-4 fw-bold mt-5 mb-4 ">Subscribe</button>
                </div><!-- card ends-->
            </div>
        </div>
    </div>


    <script src="js/bootstrap.min.js"></script>
</body>

</html>
